# MCP server entry template
# Copy to servers/your-server-name.yaml and fill in.

name: Social Fetch
slug: social-fetch
description: |
  Social Fetch is an API that returns public social media data as JSON. You can pull profiles, posts, comments, transcripts and search results from TikTok, Instagram, YouTube, X, Reddit, LinkedIn and more, using one API key and one response format. AI agents connect through the hosted MCP server.

# Source / homepage
repo: https://github.com/social-freak-ltd/socialfetch-mcp
homepage: https://www.socialfetch.dev  # optional, if different from repo
maintainer: social-freak-ltd
license: MIT

# Technical details
language: typescript          # python, node, typescript, go, rust, etc.
transport: http               # stdio, sse, http
auth: oauth                   # none, oauth, api-key, bearer-token, custom
status:                       # stable, beta, alpha, unmaintained

# What it does
tools_exposed: []
data_access: []

# How to install and use
endpoint: https://api.socialfetch.dev/mcp
install:
  command:
  notes: |
    Connect an MCP client to https://api.socialfetch.dev/mcp using OAuth, or an x-api-key header.

config_example: |

# Categorization
categories:
  - web
  - search
  # Pick from: filesystem, database, version-control, communication, search,
  # productivity, development, reasoning, web, ai, finance, other

# When was this entry last verified to be working?
last_verified: 2026-11-25
